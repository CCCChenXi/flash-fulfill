# 本机演示配置:broker 面向宿主机应用暴露 10911,故 brokerIP1 指向 127.0.0.1
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
