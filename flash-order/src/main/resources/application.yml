server:
  port: 8082

spring:
  application:
    name: flash-order
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: 172.25.80.175:8848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/flash_order_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: cx348452
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.flash.fulfill.order.entity
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

order:
  outbox:
    # 本地消息表轮询转发:批量大小 / 轮询间隔(毫秒)
    batch-size: 50
    poll-interval-ms: 1000
  timeout-cancel:
    # 待支付超时关单:超时分钟数 / 扫描间隔(毫秒) / 每批数量
    minutes: 15
    poll-interval-ms: 60000
    batch-size: 100
  auto-complete:
    # 已发货超时自动确认收货:超时天数 / 扫描间隔(毫秒)
    days: 7
    poll-interval-ms: 3600000

rocketmq:
  name-server: 172.25.80.175:9876
  producer:
    group: flash-order-producer
    send-message-timeout: 3000

feign:
  okhttp:
    enabled: false

logging:
  level:
    com.flash.fulfill: INFO
    com.flash.fulfill.order.mapper: debug